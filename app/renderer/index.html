<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Idealista Tracker</title>
  </head>
  <body>
    <h1>Idealista Tracker</h1>
    <p>Versión: <span id="version">…</span></p>
    <p>Configurado: <span id="configured">…</span></p>
    <label>Token de Notion:
      <input id="token" type="text" placeholder="ntn_… o secret_…" />
    </label>
    <label>Database ID de Notion:
      <input id="db" type="text" placeholder="id de la base de datos" />
    </label>
    <button id="save">Guardar</button>
    <button id="connect">Conectar Notion</button>
    <p id="saved" hidden>Guardado ✓</p>
    <p id="notion-status"></p>
    <hr />
    <label>Link de Idealista:
      <input id="url" type="text" placeholder="https://www.idealista.com/inmueble/…/" />
    </label>
    <button id="scrape">Scrapear</button>
    <p id="scrape-status"></p>
    <pre id="scrape-result"></pre>
    <hr />
    <button id="login-idealista">Iniciar sesión en Idealista</button>
    <p id="login-status"></p>
    <button id="sync-fav">Sincronizar favoritos</button>
    <p id="fav-status"></p>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>

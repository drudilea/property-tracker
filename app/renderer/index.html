<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Idealista Tracker</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica,
          Arial, sans-serif;
        margin: 0;
        padding: 24px;
        font-size: 14px;
        line-height: 1.5;
        color: #1d1d1f;
        background: #f7f7f8;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      h2 {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #6b6b70;
        margin: 0 0 12px;
      }
      .meta {
        color: #6b6b70;
        margin: 0 0 24px;
      }
      section {
        background: #ffffff;
        border: 1px solid #e7e7ea;
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 16px;
      }
      label {
        display: block;
        font-weight: 500;
        margin-bottom: 12px;
      }
      input[type='text'] {
        display: block;
        width: 100%;
        margin-top: 4px;
        padding: 8px 10px;
        border: 1px solid #d4d4d8;
        border-radius: 8px;
        font-size: 14px;
      }
      input[type='text']:focus {
        outline: none;
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
      }
      button {
        margin: 4px 8px 4px 0;
        padding: 8px 14px;
        border: 0;
        border-radius: 8px;
        background: #2563eb;
        color: #fff;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
      }
      button:hover {
        background: #1d4ed8;
      }
      button.secondary {
        background: #ececef;
        color: #1d1d1f;
      }
      button.secondary:hover {
        background: #e0e0e4;
      }
      .status {
        margin: 8px 0 0;
        color: #6b6b70;
        min-height: 1em;
      }
      pre {
        background: #f0f0f3;
        padding: 12px;
        border-radius: 8px;
        overflow: auto;
        max-height: 280px;
        font-size: 12px;
        margin: 12px 0 0;
      }
      pre:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>Idealista Tracker</h1>
    <p class="meta">
      Versión <span id="version">…</span> · Configurado:
      <span id="configured">…</span>
    </p>

    <section>
      <h2>Notion</h2>
      <label
        >Token de Notion
        <input id="token" type="text" placeholder="ntn_… o secret_…" />
      </label>
      <label
        >Database ID de Notion
        <input id="db" type="text" placeholder="id de la base de datos" />
      </label>
      <button id="save">Guardar</button>
      <button id="connect" class="secondary">Conectar Notion</button>
      <p id="saved" class="status" hidden>Guardado ✓</p>
      <p id="notion-status" class="status"></p>
    </section>

    <section>
      <h2>Capturar piso</h2>
      <label
        >Link de Idealista
        <input
          id="url"
          type="text"
          placeholder="https://www.idealista.com/inmueble/…/"
        />
      </label>
      <button id="scrape">Scrapear</button>
      <p id="scrape-status" class="status"></p>
      <pre id="scrape-result"></pre>
    </section>

    <section>
      <h2>Idealista &amp; favoritos</h2>
      <button id="login-idealista" class="secondary">
        Iniciar sesión en Idealista
      </button>
      <p id="login-status" class="status"></p>
      <button id="sync-fav">Sincronizar favoritos</button>
      <p id="fav-status" class="status"></p>
    </section>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>

name: Build apps

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            artifact: property-tracker-macos
          - os: windows-latest
            label: Windows
            artifact: property-tracker-windows

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The packaged app drives the user's installed Chrome at runtime, so we
      # do NOT download Playwright's bundled browsers here — only the npm
      # package is needed (electron-builder unpacks it via asarUnpack).
      - name: Build and package
        run: npm run pack
        env:
          # No Apple Developer certs in CI: skip code signing so the unsigned
          # build succeeds. The macOS app opens via Gatekeeper "Open Anyway".
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: release/**
          if-no-files-found: error

  # On a version tag (v*), gather both platforms' builds into one GitHub Release
  # so users get a stable download link (and the in-app update check can see it).
  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: dist

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s globstar nullglob
          files=(dist/**/*.zip dist/**/*.exe)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No build artifacts found to release." >&2
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            "${files[@]}"

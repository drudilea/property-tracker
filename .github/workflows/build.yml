name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Fast checks on every push/PR to main: typecheck, lint, tests, and the
  # renderer/main bundle build — no packaging, no artifacts.
  verify:
    name: Verify
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint, test, build
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build:app

  # Package the desktop apps. Tags only.
  build:
    name: Build ${{ matrix.label }}
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            artifact: property-tracker-macos
          - os: windows-latest
            label: Windows
            artifact: property-tracker-windows

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The packaged app drives the user's installed Chrome at runtime, so we
      # do NOT download Playwright's bundled browsers here — only the npm
      # package is needed (electron-builder unpacks it via asarUnpack).
      - name: Build and package
        run: npm run pack
        env:
          # No Apple Developer certs in CI: skip code signing so the unsigned
          # build succeeds. The macOS app opens via Gatekeeper "Open Anyway".
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Upload only the top-level distributables (the packaged zip / portable
      # exe), NOT the unpacked mac-arm64/ and win-unpacked/ dirs — otherwise the
      # raw unpacked exe and electron-builder's elevate.exe leak into the release.
      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.zip
            release/*.exe
          if-no-files-found: error

  # Gather both platforms' builds into one GitHub Release (stable download link
  # the in-app update check reads). Tags only.
  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: dist

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s globstar nullglob
          files=(dist/**/*.zip dist/**/*.exe)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No build artifacts found to release." >&2
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            "${files[@]}"
